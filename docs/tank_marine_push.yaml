# 步坦协同（坦克掩护步兵的循环蛙跳推进）—— T5 循环版（真机可跑）
#
# 用 T1 siege 动作 + T4 point_toward 动态点 + 去重量化；T3 归一化（run 侧传 catalog=load_terran）。
#
# 循环 4 步（自动蛙跳到 target）：
#   formup ─▶ tank_hop ─▶ siege_gate ─▶ inf_hop ─▶ threat_gate ─┐
#              坦克 move       距目标≤tank_cover    步兵 attack_move    └─(CLEARED)─回到 tank_hop
#              到步兵组心(3内)  才 siege(否则 SKIP)   到前沿 point_toward
#   tank_hop/inf_hop 内 arrived(inf, target, 8) → exit_strategy ARRIVED（任意时刻近似）
#
# 前沿点 = point_toward(group_center(armor), target, tank_cover)：坦克覆盖内、朝敌方向。
# 坦克离目标远时 siege_gate 跳过架起（SKIP→inf_hop）；仅坦克入 target 10.4 内那一轮才 siege。

strategy:
  id: tank_marine_push
  version: 1
  group_slots: [inf, armor]
  params:
    target: {type: point, default: [127.5, 119.5]}   # 敌方主矿
    garrison_pos: {type: point, default: [60.0, 40.0]}  # 主矿入口驻扎点（runtime 按 CC+敌方方向算）
    inf_hold_dist: {type: float, default: 12.0}       # R1：步兵脱队判定距离（> tank_cover，正常蛙跳不触发）
    tank_cover: {type: float, default: 10.4}          # R2/R3：架起射程 13 × 80%
    hold_secs: {type: float, default: 3.0}            # R1：步兵停顿时长
    threat_radius: {type: float, default: 12.0}       # R4：威胁半径
    threat_limit: {type: int, default: 3}            # R4：近敌 < 此值且血线健康才推进
    min_inf: {type: int, default: 20}
    min_tank: {type: int, default: 4}
  variables: {}
  initial_step: garrison
  steps:
    # 驻扎主矿入口：枪兵每帧前往 garrison_pos 防守，凑齐 20+4 → formup
    - step_id: garrison
      branches:
        - when: {op: and, args: [{op: ">=", args: [{op: group_count, args: [inf, MARINE]}, {param: min_inf}]}, {op: ">=", args: [{op: group_count, args: [armor, SIEGETANK]}, {param: min_tank}]}]}
          do: [{op: exit_step, kind: done, reason: READY}]
        - do:
            - {op: group_action, group_slot: inf, type: MARINE, action_atom: attack_move_to, params: {position: {param: garrison_pos}}}

    - step_id: formup
      branches:
        - when: {op: and, args: [{op: ">=", args: [{op: group_count, args: [inf, MARINE]}, {param: min_inf}]}, {op: ">=", args: [{op: group_count, args: [armor, SIEGETANK]}, {param: min_tank}]}]}
          do: [{op: exit_step, kind: done, reason: FORMED}]
        - do: []

    # 坦克推进到步兵组心；到位（3 内）→ siege_gate
    - step_id: tank_hop
      branches:
        - when: {op: arrived, args: [inf, {param: target}, 8.0]}
          do: [{op: exit_strategy, kind: done, reason: ARRIVED}]
        - when: {op: arrived, args: [armor, {op: group_center, args: [inf]}, 3.0]}
          do: [{op: exit_step, kind: done, reason: IN_PLACE}]
        - do:
            - {op: group_action, group_slot: armor, type: SIEGETANK, action_atom: move_to, params: {position: {op: group_center, args: [inf]}}}

    # 距目标 ≤ tank_cover 才架起（T1 siege）；否则 SKIP 跳过（坦克未架起跟进）
    - step_id: siege_gate
      branches:
        - when: {op: arrived, args: [armor, {param: target}, {param: tank_cover}]}
          do:
            - {op: group_action, group_slot: armor, type: SIEGETANK, action_atom: siege}
            - {op: exit_step, kind: done, reason: SIEGED}
        - do: [{op: exit_step, kind: done, reason: SKIP}]

    # 步兵推进到前沿点（坦克覆盖内、朝敌方向）；脱队→停等；到位→threat_gate
    - step_id: inf_hop
      branches:
        - when: {op: arrived, args: [inf, {param: target}, 8.0]}
          do: [{op: exit_strategy, kind: done, reason: ARRIVED}]
        - when: {op: ">", args: [{op: distance_between, args: [inf, armor]}, {param: inf_hold_dist}]}
          do: [{op: exit_step, kind: interrupted, reason: STRAGGLED}]
        - when: {op: arrived, args: [inf, {op: point_toward, args: [{op: group_center, args: [armor]}, {param: target}, {param: tank_cover}]}, 3.0]}
          do: [{op: exit_step, kind: done, reason: IN_PLACE}]
        - do:
            - {op: group_action, group_slot: inf, type: MARINE, action_atom: attack_move_to, params: {position: {op: point_toward, args: [{op: group_center, args: [armor]}, {param: target}, {param: tank_cover}]}}}

    # 脱队停等：hold + step_elapsed ≥ hold_secs → RESUME
    - step_id: inf_wait
      branches:
        - when: {op: ">=", args: [{op: step_elapsed}, {param: hold_secs}]}
          do: [{op: exit_step, kind: done, reason: RESUME}]
        - do:
            - {op: group_action, group_slot: inf, type: MARINE, action_atom: hold_position}

    # 威胁评估：前沿点近敌 < threat_limit 且血线 > 0.6 → CLEARED → 下一轮 tank_hop；否则继续清理
    - step_id: threat_gate
      branches:
        - when: {op: and, args: [{op: "<", args: [{op: enemy_count_near, args: [{op: point_toward, args: [{op: group_center, args: [armor]}, {param: target}, {param: tank_cover}]}, {param: threat_radius}]}, {param: threat_limit}]}, {op: ">", args: [{op: group_hp_ratio, args: [inf]}, 0.6]}]}
          do: [{op: exit_step, kind: done, reason: CLEARED}]
        - do:
            - {op: group_action, group_slot: inf, type: MARINE, action_atom: attack_move_to, params: {position: {op: point_toward, args: [{op: group_center, args: [armor]}, {param: target}, {param: tank_cover}]}}}

  edges:
    - {from: garrison, to: formup, kind: done, reason: READY}
    - {from: formup, to: tank_hop, kind: done, reason: FORMED}
    - {from: tank_hop, to: siege_gate, kind: done, reason: IN_PLACE}
    - {from: siege_gate, to: inf_hop, kind: done, reason: SIEGED}
    - {from: siege_gate, to: inf_hop, kind: done, reason: SKIP}
    - {from: inf_hop, to: inf_wait, kind: interrupted, reason: STRAGGLED}
    - {from: inf_wait, to: inf_hop, kind: done, reason: RESUME}
    - {from: inf_hop, to: threat_gate, kind: done, reason: IN_PLACE}
    - {from: threat_gate, to: tank_hop, kind: done, reason: CLEARED}
  on_exit: release
  loop_limits: {max_step_transitions: 80}

assembly:
  id: tank_marine_assembly
  groups:
    - group_id: G_INF
      composition:
        MARINE: {min: 20, target: 20, max: 20}
    - group_id: G_TANK
      composition:
        SIEGETANK: {min: 4, target: 4, max: 4}
  strategy_instances:
    - instance_id: s1
      strategy_ref: tank_marine_push
      bindings: {inf: G_INF, armor: G_TANK}
      params: {target: [127.5, 119.5]}
