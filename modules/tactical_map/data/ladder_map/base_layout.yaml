      depot15: {pos: [44.5, 38.5], size: 2, kind: supply}
      depot16: {pos: [46.5, 38.5], size: 2, kind: supply}
      # rax1-2 真机 can_place+挂件2×2+空地评分扫描（CC 东侧/补给网格上方，STAIR_OPEN=96 最高分）
      # 旧位 [42.5,42.5]+[45.5,44.5] 在 NW 形成对角楼梯墙 → 集合点卡缝（与 TR 同一 bug）
      rax1: {pos: [55.5, 33.5], size: 3, kind: production}
      rax2: {pos: [58.5, 35.5], size: 3, kind: production}
      rax3: {pos: [53.5, 39.5], size: 3, kind: production}
