# LadderMap（破晓黎明）主基建造模板 —— 固定有序建造位（authoring 数据）
# 来源：run_slot_scan.py 真机 can_place 扫描（docs/slot_scan.log，不花矿）+ 手动 trace 实测
# 语义：
#   - spawns 按出生点分变体（出生点随机、几何随 180° 旋转）；运行时 spawn_layout_nearest 自动选
#   - pos = 校准过的世界建造点（权威，偶数尺寸建筑在半格上）；size = footprint 边长
#   - build_slots 声明顺序 = 建造顺序（生产运行时 PlacementInRegion("home") 按序取未占位）
# bl 出生点 (48.5,28.5)：主矿左上 4×4 补给站网格（16 格全可建造）+ 兵营 ×2（与 CC/网格不重叠）
# tr 出生点 (127.5,119.5)：镜像布局（180° 旋转），同样 4×4 网格 + 兵营 ×2
