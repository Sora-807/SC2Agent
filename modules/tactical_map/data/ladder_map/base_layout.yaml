# LadderMap（破晓黎明）主基建造模板 —— 固定有序建造位（authoring 数据）
# 来源：run_slot_scan.py 真机 can_place 扫描（docs/slot_scan*.log，不花矿）+ 手动 trace 实测
# 语义：
#   - spawns 按出生点分变体（出生点随机）；运行时 spawn_layout_nearest 自动选
#   - pos = 校准过的世界建造点（权威；2×2 锚点在格角、3×3 在格心，ADR-0027 锁定公式）
#   - kind：supply=补给位 / production=生产位（3×3）/ addon=挂件预留（2×2，不参与放置）
#   - build_slots 声明顺序 = 建造顺序（生产运行时按 kind+size 过滤取未占位）
# 布局（错位楼梯，每栋生产建筑右下 2×2 为挂件预留）：
#   bl：补给站 4×4 网格（主矿左上 x40–47/y32–39）+ 生产区在其上方（rax1-4 楼梯 + 4 挂件）
#   tr：镜像含义（生产区在补给站网格左侧，独立扫描校准）
map_name: LadderMap
region_name: main_base
spawns:
  bl:
    origin: [48.5, 28.5]
    anchor: [48.5, 28.5]
    build_slots:
      depot1:  {pos: [40.5, 32.5], size: 2, kind: supply}
