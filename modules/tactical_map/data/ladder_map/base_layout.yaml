      rax4_addon: {pos: [58.5, 40.5], size: 2, kind: addon}
      # factory1 真机 can_place+挂件2×2 双锁定（CC 西侧/补给网格南侧，避开 NE ramp 路径不堵门）
      factory1: {pos: [40.5, 29.5], size: 3, kind: production}
      factory1_addon: {pos: [42.5, 28.5], size: 2, kind: addon}
